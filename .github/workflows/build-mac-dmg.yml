name: Build mac DMG (universal)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-dmg:
    name: Build universal mac DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & electron
        run: npm run build

      - name: Build mac DMG (universal)
        env:
          # Optional notarization/signing secrets (set in repo Secrets if you want signing + notarize)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg

      - name: Show release files (debug)
        run: ls -la release || true
