name: Build macOS DMG

on:
  push:
    branches:
      - main
      - master
      - universal-dmg
  workflow_dispatch:

jobs:
  build-mac:
    name: Build universal macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set backend URL
        run: echo "VITE_BACKEND_URL=https://api.strategixinsightsadmin.tech" > .env

      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE_TIME: true
        run: npm run dist:mac

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: Strategixinsights-mac-universal
          path: release/*-universal.dmg
          retention-days: 30